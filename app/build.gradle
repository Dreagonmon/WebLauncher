apply plugin: 'com.android.application'

android {
    compileSdk = 36
    defaultConfig {
        applicationId = "top.dreagonmon.app.dreamoonlauncher"
        minSdk = 26
        targetSdk = 36
        versionCode = 5
        versionName = "1.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace = 'top.dreagonmon.app.dreamoonlauncher'
    buildFeatures {
        // AGP 9 移除了 android.defaults.buildfeatures.buildconfig 全局开关，改用 DSL
        buildConfig = true
    }
}

configurations.all {
    resolutionStrategy {
        // kotlin-stdlib 1.8+ 已合并 jdk7/jdk8 扩展，强制统一版本消除重复类
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // library
//    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
